version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # vsce refuses to package when these typings are newer than engines.vscode (^1.85.0). Raise both together by hand.
      - dependency-name: "@types/vscode"
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /infra
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /packages/dashboard
    schedule: { interval: weekly }

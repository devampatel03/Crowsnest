name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Crowsnest does not publish to PyPI or npm yet; this release attaches build artifacts,
    # an SBOM and build-provenance attestations to a GitHub release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: pnpm
      - name: Verify tag matches every manifest version and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs "$TAG"
      - run: pnpm install --frozen-lockfile
      - name: Build JS packages
        env:
          NEXT_PUBLIC_SITE_URL: https://crowsnest.example
        run: pnpm run build
      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs "$TAG" --notes > release-notes.md
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            sbom.cdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* sbom.cdx.json --title "$TAG" --notes-file release-notes.md --verify-tag

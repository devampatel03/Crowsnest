name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Crowsnest does not publish to PyPI or npm yet; this release attaches build artifacts,
    # an SBOM and build-provenance attestations to a GitHub release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Verify tag matches every manifest version and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs "$TAG"
      - run: pnpm install --frozen-lockfile
      - name: Build JS packages
        env:
          NEXT_PUBLIC_SITE_URL: https://crowsnest.example
        run: pnpm run build
      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs "$TAG" --notes > release-notes.md
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*
            sbom.cdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* sbom.cdx.json --title "$TAG" --notes-file release-notes.md --verify-tag

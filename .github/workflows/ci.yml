name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The dashboard refuses a CI build without a real (non-localhost) site origin because it is
  # baked into canonicals, the sitemap and robots.txt. These builds are not deployed.
  NEXT_PUBLIC_SITE_URL: https://crowsnest.example

jobs:
  python-static:
    name: Python lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy

  python-test:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Import check
        run: python -c "import packages.core.api"
      - name: Pytest with coverage (fails under the pyproject fail_under threshold)
        run: python -m pytest -q --cov --cov-report=xml:coverage.xml --junitxml=pytest-report.xml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: error
          retention-days: 14

  js-static:
    name: JS lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

  js-test:
    name: JS tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "20" }
          - { os: ubuntu-latest, node: "22" }
          - { os: windows-latest, node: "22" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  smoke:
    name: Backend smoke (scripts/smoke.mjs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Backend only: the script starts uvicorn on a temp DuckDB with no API keys. The dashboard
    # half (SMOKE_DASH) needs a started Next server and is not run in CI, see .github/CI.md.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: python -m pip install -e .
      - run: node scripts/smoke.mjs
        env:
          SMOKE_PYTHON: python

  ci-ok:
    name: ci-ok
    if: always()
    needs: [python-static, python-test, js-static, js-test, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi

name: Publish CLI to npm

# Manual on purpose: publishing is permanent. Run it from the Actions tab after the version tag's release exists.
# This job only STAGES the version with a stage-only token. A person approves it on npm with two-factor
# authentication (`npm stage approve`), so a leaked token cannot put a version on the registry by itself.
# One-time setup is in packages/cli/PUBLISHING.md (npm org, NPM_TOKEN secret, the "npm" environment).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and pack, but do not stage"
        type: boolean
        default: true

concurrency:
  group: publish-cli
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers on this environment to get an approval click before anything is staged.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # staging needs Node 22.14 or newer
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm that has `npm stage`
        run: |
          npm install -g "npm@^11.15.0"
          npm --version
      - run: pnpm install --frozen-lockfile
      - name: Lint, test and build
        working-directory: packages/cli
        run: |
          pnpm run lint
          pnpm run test
          pnpm run build
      - name: Refuse to republish an existing version
        working-directory: packages/cli
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on npm. Bump the version first."
            exit 1
          fi
      - name: Show what would be published
        working-directory: packages/cli
        run: npm pack --dry-run
      - name: Stage the version
        if: ${{ !inputs.dry_run }}
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --provenance --access public
      - name: Show the staged version to approve
        if: ${{ !inputs.dry_run }}
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm stage list "$(node -p "require('./package.json').name")"
          echo "::notice::Staged, not published yet. Approve it with: npm stage approve <stage-id>  (needs your 2FA code)"

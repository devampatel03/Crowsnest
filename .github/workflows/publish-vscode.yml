name: Publish VS Code extension

# Manual on purpose: a published version cannot be changed. One-time setup (publisher, token, secrets) is in
# packages/vscode-extension/PUBLISHING.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the .vsix and attach it to the run, but do not publish"
        type: boolean
        default: true
      open_vsx:
        description: "Also publish to Open VSX (VSCodium, Cursor, Gitpod and others)"
        type: boolean
        default: false

concurrency:
  group: publish-vscode
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers on this environment to get an approval click before anything is published.
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and unit tests
        working-directory: packages/vscode-extension
        run: |
          pnpm run typecheck
          pnpm run test
      - name: Build the .vsix
        working-directory: packages/vscode-extension
        run: pnpm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crowsnest-vscode-vsix
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error
      - name: Publish to the Visual Studio Marketplace
        if: ${{ !inputs.dry_run }}
        working-directory: packages/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm run publish:marketplace
      - name: Publish to Open VSX
        if: ${{ !inputs.dry_run && inputs.open_vsx }}
        working-directory: packages/vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm run publish:openvsx

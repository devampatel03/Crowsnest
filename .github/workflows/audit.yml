name: Audit

on:
  schedule:
    - cron: "23 5 * * *"
  pull_request:
    paths:
      - pnpm-lock.yaml
      - pyproject.toml
      - scripts/audit-js.mjs
      - .github/workflows/audit.yml
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Audit the resolved third-party dependencies. The project itself is not on PyPI, so it is excluded:
      # pip-audit cannot audit an editable or unpublished package, and --strict treats that as a failure.
      - run: python -m pip install .
      - run: python -m pip freeze --exclude crowsnest-core > audit-requirements.txt
      - run: python -m pip install pip-audit
      - run: pip-audit --strict --disable-pip --no-deps -r audit-requirements.txt

  pnpm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on any production advisory except the two explicit, documented exceptions.
      - run: node scripts/audit-js.mjs

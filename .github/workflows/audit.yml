name: Audit

on:
  schedule:
    - cron: "23 5 * * *"
  pull_request:
    paths:
      - pnpm-lock.yaml
      - pyproject.toml
      - scripts/audit-js.mjs
      - .github/workflows/audit.yml
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Audit the resolved third-party dependencies. The project itself is not on PyPI, so it is excluded:
      # pip-audit cannot audit an editable or unpublished package, and --strict treats that as a failure.
      - run: python -m pip install .
      - run: python -m pip freeze --exclude crowsnest-core > audit-requirements.txt
      - run: python -m pip install pip-audit
      - run: pip-audit --strict --disable-pip --no-deps -r audit-requirements.txt

  pnpm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on any production advisory except the two explicit, documented exceptions.
      - run: node scripts/audit-js.mjs

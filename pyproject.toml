[project]
name = "crowsnest-core"
version = "0.1.0"
description = "Crowsnest core agent orchestration and data federation layer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.104.0",
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.4.0",
    "structlog>=24.4.0",
    "rich>=13.7.0",
    "packaging>=24.1",
    "gitpython>=3.1.43",
    "tree-sitter>=0.23.0",
    "aiofiles>=24.1.0",
    "sse-starlette>=2.1.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

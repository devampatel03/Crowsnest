services:
  crowsnest-api:
    # The prebuilt image is pulled, so the first start takes a minute, not an hour on a slow connection. If it cannot
    # be pulled (offline, or a branch newer than the last release), Compose builds it from the Dockerfile instead.
    image: ${CROWSNEST_IMAGE:-ghcr.io/devampatel03/crowsnest-api:latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    # Optional: API keys and settings. Nothing breaks if there is no .env file (needs Docker Compose 2.24 or newer).
    env_file:
      - path: ../.env
        required: false
    volumes:
      - crowsnest-data:/data
      # The folder Crowsnest can read, mounted read only. CROWSNEST_PROJECTS is the folder on this machine that holds
      # your projects. Without it an empty ./examples folder is shared, and the scan dialog says how to set this.
      - ${CROWSNEST_PROJECTS:-../examples}:/projects:ro
    environment:
      - CROWSNEST_DB_PATH=/data/crowsnest.duckdb
      - CROWSNEST_SNAPSHOT_DIR=/data/snapshots
      # Lets a path typed as it appears on this machine be mapped to the shared folder (empty when it is not set).
      - CROWSNEST_PROJECTS_HOST=${CROWSNEST_PROJECTS:-}
    restart: unless-stopped

  crowsnest-dashboard:
    build:
      context: ..
      dockerfile: packages/dashboard/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Docker Desktop delivers the request to the container from its own gateway address, which the dashboard
      # would take for another machine and answer with 404. The port above is published on this machine only,
      # so nothing else can reach it.
      - CROWSNEST_CONSOLE=on
    # NEXT_PUBLIC_API_URL is read when the image is built (Next.js inlines it into the browser code), so it
    # cannot be set here. The default, http://localhost:8000, is the published API port, which is what a
    # browser on this machine needs. A different address needs an ARG/ENV in the dashboard Dockerfile.
    depends_on:
      crowsnest-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  crowsnest-data:

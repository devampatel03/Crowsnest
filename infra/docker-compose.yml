version: "3.9"

services:
  crowsnest-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - crowsnest-data:/data
      - ../.env:/app/.env:ro
    environment:
      - CROWSNEST_DB_PATH=/data/crowsnest.duckdb
      - CROWSNEST_SNAPSHOT_DIR=/data/snapshots
    restart: unless-stopped

  crowsnest-dashboard:
    build:
      context: ../packages/dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://crowsnest-api:8000
    depends_on:
      - crowsnest-api
    restart: unless-stopped

volumes:
  crowsnest-data:
